{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h2>Edit Supplier Order</h2>

            <p class="text-muted mb-0">
                Work Item {{ parts_order.work_item.number }}
            </p>
        </div>

        <a href="{{ url_for(
            'main.work_item_details',
            item_id=parts_order.work_item_id
        ) }}"
           class="btn btn-secondary">
            Cancel
        </a>

    </div>

    <div class="card shadow-sm">

        <div class="card-body">

            <form method="POST">
                
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3">
                    <label class="form-label">
                        Supplier *
                    </label>

                    {% set supplier_found = namespace(value=false) %}

                    <select name="supplier"
                            class="form-select"
                            required>

                        <option value="">
                            Select Supplier
                        </option>

                        {% for supplier in suppliers %}

                            {% if supplier.name == parts_order.supplier %}
                                {% set supplier_found.value = true %}
                            {% endif %}

                            <option value="{{ supplier.name }}"
                                    {% if supplier.name == parts_order.supplier %}
                                        selected
                                    {% endif %}>
                                {{ supplier.name }}
                            </option>

                        {% endfor %}

                        {% if not supplier_found.value %}
                            <option value="{{ parts_order.supplier }}"
                                    selected>
                                {{ parts_order.supplier }}
                            </option>
                        {% endif %}

                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Supplier Order Number
                    </label>

                    <input type="text"
                           name="order_number"
                           class="form-control"
                           value="{{ parts_order.order_number or '' }}">
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Order Notes
                    </label>

                    <textarea name="notes"
                              class="form-control"
                              rows="4">{{ parts_order.notes or "" }}</textarea>
                </div>

                <button type="submit"
                        class="btn btn-primary">
                    Save Changes
                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
